[tool.pyright]
include = ["backend"]
extraPaths = ["backend"]
pythonVersion = "3.12"
typeCheckingMode = "off"

[tool.ruff]
src = ["backend"]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
pythonpath = ["backend"]
addopts = "--strict-markers -v"
