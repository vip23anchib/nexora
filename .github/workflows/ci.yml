name: Nexora Platform CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-quality:
    name: Backend Linting, Type Checks & Pytest Suite
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check formatting with Ruff
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Run Django system check & migrations
        run: |
          python backend/manage.py check
          python backend/manage.py migrate --noinput

      - name: Execute Pytest Suite with Coverage
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          CELERY_TASK_ALWAYS_EAGER: "True"
        run: |
          pytest backend/tests/ -v --tb=short

  frontend-quality:
    name: Frontend Build & Type Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Compile TypeScript & Build Production Bundle
        working-directory: ./frontend
        run: npm run build
